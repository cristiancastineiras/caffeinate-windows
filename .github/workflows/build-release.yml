name: Build y publicar release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Compilar caffeine.exe y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Compilar
        run: make

      - name: Publicar GitHub Release con el .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build/win/caffeine.exe
          generate_release_notes: true
          body: |
            ## Descarga
            Descargá `caffeine.exe` y ejecutalo directamente — sin instalación.

            ### Uso rápido
            - Doble click para iniciar
            - Click derecho en el icono de la bandeja para ver opciones
            - Soporta temporizadores (30min, 1h, 2h, 4h, 8h) y modo indefinido
            - Mantiene activo el estado en Teams/Slack/etc
