name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Compilar y publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular próxima versión
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v1.0.0"
            NEW_TAG="v1.0.0"
          else
            VERSION=${LATEST#v}
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT

      - name: Instalar MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Compilar caffeine.exe
        run: make

      - name: Crear tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Caffeine ${{ steps.version.outputs.tag }}"
          files: build/win/caffeine.exe
          generate_release_notes: true
          body: |
            ## Descarga
            Bajá `caffeine.exe` y ejecutalo directamente — sin instalación.

            **Uso rápido:**
            - Doble click para iniciar
            - Click derecho en el icono de la bandeja para ver las opciones
            - Temporizadores: 30min, 1h, 2h, 4h, 8h o modo indefinido
            - Mantiene el estado activo en Teams/Slack/etc

